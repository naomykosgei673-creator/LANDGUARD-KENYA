services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: landguard
      POSTGRES_PASSWORD: landguard
      POSTGRES_DB: landguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  ml-service:
    build: ./ml-service
    restart: unless-stopped
    environment:
      PORT: "5001"
    ports:
      - "5001:5001"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://landguard:landguard@db:5432/landguard?schema=public
      NODE_ENV: production
      PORT: "4000"
      CORS_ORIGIN: http://localhost:3000
      JWT_ACCESS_SECRET: change-me-in-production-0000000000000000000000000000000000
      JWT_REFRESH_SECRET: change-me-in-production-1111111111111111111111111111111111
      PAYMENTS_SANDBOX: "true"
      ML_ENABLED: "true"
      ML_SERVICE_URL: http://ml-service:5001
    ports:
      - "4000:4000"
    # Note: set schema.prisma provider to "postgresql" before building for Docker.
    command: sh -c "npx prisma migrate deploy && npm run db:seed && node dist/index.js"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
    ports:
      - "3000:3000"

volumes:
  pgdata:
